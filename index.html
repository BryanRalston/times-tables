    const left = document.createElement("div");
    left.className = "why-pan";
    const right = document.createElement("div");
    right.className = "why-pan";
    const extras = Math.max(0, model.groups - 1);
    const leftTake = makeWhyTake("Leave one group");
    leftTake.classList.add("why-n-stack");
    for (let index = 0; index < extras; index += 1) {
      leftTake.append(makeWhyN(model));
    }
    const leftRest = document.createElement("span");
    leftRest.className = "why-n-stack";
    leftRest.append(makeWhyN(model));
    if (extras) {
      left.append(leftTake);
    }
    left.append(leftRest);
    const rightTake = makeWhyTake("Leave one group");
    rightTake.classList.add("why-clusters");
    for (let index = 0; index < extras; index += 1) {
      rightTake.append(makeDotCluster(model.hidden));
    }
    const rightRest = document.createElement("span");
    rightRest.className = "why-clusters";
    rightRest.append(makeDotCluster(model.hidden));
    if (extras) {
      right.append(rightTake);
    }
    right.append(rightRest);
    pans.append(left, right);
    scale.append(beam, fulcrum, strings, pans);
    finishWhyBoard(question, model, scale);
  }

  function renderWhyBalance(question, model) {
    const scale = document.createElement("div");
    scale.className = "why-scale";
    scale.setAttribute("aria-hidden", "true");
    const beam = document.createElement("div");
    beam.className = "why-beam";
    const strings = document.createElement("div");
    strings.className = "why-strings";
    strings.append(document.createElement("span"), document.createElement("span"));
    const fulcrum = document.createElement("div");
    fulcrum.className = "why-fulcrum";
    const pans = document.createElement("div");
    pans.className = "why-pans";
    const left = document.createElement("div");
    left.className = "why-pan";
    const right = document.createElement("div");
    right.className = "why-pan";
    const mystery = makeWhyN(model);
    const knownPan = model.family === "subtrahend" ? right : left;
    const totalPan = model.family === "subtrahend" ? left : right;
    if (model.slot === "left") {
      knownPan.append(mystery);
      appendWhyTiles(knownPan, model.known, model.known);
    } else {
      appendWhyTiles(knownPan, model.known, model.known);
      knownPan.append(mystery);
    }
    appendWhyTiles(totalPan, model.total, model.known);
    pans.append(left, right);
    scale.append(beam, fulcrum, strings, pans);
    finishWhyBoard(question, model, scale);
  }

  function appendWhyTiles(parent, count, takeCount) {
    if (takeCount > 0) {
      const takeGroup = document.createElement("span");
      takeGroup.className = "why-group why-take";
      takeGroup.setAttribute("role", "button");
      takeGroup.tabIndex = 0;
      takeGroup.setAttribute("aria-label", "Take these off both pans");
      for (let index = 0; index < takeCount; index += 1) {
        const tile = document.createElement("span");
        tile.className = "why-tile take-away";
        takeGroup.append(tile);
      }
      parent.append(takeGroup);
    }
    const leftover = count - takeCount;
    if (leftover > 0) {
      const restGroup = document.createElement("span");
      restGroup.className = "why-group";
      for (let index = 0; index < leftover; index += 1) {
        const tile = document.createElement("span");
        tile.className = "why-tile";
        restGroup.append(tile);
      }
      parent.append(restGroup);
    }
  }

  function setWhyTakeOffset(dx, dy) {
    els.why.querySelectorAll(".why-take").forEach((group) => {
      group.style.transform = dx || dy ? `translate(${dx}px, ${dy}px)` : "";
    });
  }

  function bindWhyTake(question) {
    const groups = els.why.querySelectorAll(".why-take");
    let drag = null;

    const finishDrag = (event) => {
      if (!drag || event.pointerId !== drag.pointerId) {
        return;
      }
      const target = drag.target;
      if (target.hasPointerCapture(event.pointerId)) {
        target.releasePointerCapture(event.pointerId);
      }
      drag = null;
      setWhyTakeOffset(0, 0);
      doWhyMove(question);
    };

    groups.forEach((group) => {
      group.addEventListener("pointerdown", (event) => {
        if (state.locked || whyMoveDone() || event.button) {
          return;
        }
        event.preventDefault();
        group.setPointerCapture(event.pointerId);
        drag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          target: group,
        };
      });
      group.addEventListener("pointermove", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) {
          return;
        }
        event.preventDefault();
        setWhyTakeOffset(event.clientX - drag.startX, event.clientY - drag.startY);
        if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) >= 16) {
          const target = drag.target;
          if (target.hasPointerCapture(event.pointerId)) {
            target.releasePointerCapture(event.pointerId);
          }
          drag = null;
          setWhyTakeOffset(0, 0);
          doWhyMove(question);
        }
      });
      group.addEventListener("pointerup", finishDrag);
      group.addEventListener("pointercancel", (event) => {
        if (!drag || event.pointerId !== drag.pointerId) {
          return;
        }
        if (drag.target.hasPointerCapture(event.pointerId)) {
          drag.target.releasePointerCapture(event.pointerId);
        }
        drag = null;
        setWhyTakeOffset(0, 0);
      });
      group.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          doWhyMove(question);
        }
      });
    });
  }

  function renderWhyModel(question) {
    window.clearTimeout(state.whyId);
    state.whyId = null;
    const model = engine.whyModel(question);
    els.why.replaceChildren();
    els.why.classList.remove("is-preview", "is-tilt-left", "is-tilt-right");
    els.why.dataset.phase = "idle";
    if (!model) {
      els.why.hidden = true;
      return;
    }
    if (model.kind === "frame") {
      renderWhyFrame(question, model);
      return;
    }
    if (model.kind === "groups") {
      renderWhyGroups(question, model);
      return;
    }
    if (model.kind === "balance") {
      renderWhyBalance(question, model);
      return;
    }
    const unexpected = model.kind;
    void unexpected;
    els.why.hidden = true;
  }

  function whyMoveDone() {
    return els.why.dataset.phase === "lift" || els.why.dataset.phase === "reveal";
  }

  function doWhyMove(question) {
    if (state.locked || whyMoveDone()) {
      return;
    }
    const model = engine.whyModel(question);
    if (!model) {
      return;
    }
    setAnswer("");
    els.why.classList.remove("is-preview", "is-tilt-left", "is-tilt-right");
    els.why.dataset.phase = "lift";
    setWhyTakeOffset(0, 0);
    els.why.querySelectorAll(".why-take").forEach((group) => {
      group.removeAttribute("tabindex");
      group.classList.remove("is-nudge");
    });
    setWhyCaption("", "lift");
    setWhyPrompt(question, "lift");
    setFeedback(engine.whyCaption(model, "lift"), "");
    screens.practice.classList.add("is-lifted");
    els.keypad.hidden = !engine.leftoverTypingAllowed(question, whyMoveDone());
  }

  function nudgeWhyMove(question) {
    const model = engine.whyModel(question);
    setFeedback(engine.whyNudge(model), "hint");
    const groups = els.why.querySelectorAll(".why-take");
    groups.forEach((group) => {
      group.classList.remove("is-nudge");
      void group.offsetWidth;
      group.classList.add("is-nudge");
    });
  }

  function clearWhyTilt() {
    els.why.classList.remove("is-tilt-left", "is-tilt-right");
  }

  function tiltWhyScale(question, given) {
    const model = engine.whyModel(question);
    const direction = engine.whyTilt(model, given);
    clearWhyTilt();
    if (direction === "level") {
      return;
    }
    void els.why.offsetWidth;
    els.why.classList.add(direction === "left" ? "is-tilt-left" : "is-tilt-right");
  }

  function syncWhyPreview(value) {
    if (els.why.hidden || els.why.dataset.phase !== "lift") {
      return;
    }
    const shown = els.why.querySelectorAll(".why-n-value");
    if (!shown.length) {
      return;
    }
    shown.forEach((node) => {
      node.textContent = value || "";
    });
    els.why.classList.toggle("is-preview", Boolean(value));
  }

  function clearIsolatedHold() {
    state.holdingIsolated = false;
    screens.practice.classList.remove("is-isolated");
    delete screens.practice.dataset.isolatedHold;
  }

  function applyHoldPlan(question, plan) {
    switch (plan.kind) {
      case "stay":
        clearIsolatedHold();
        return 0;
      case "advance":
        clearIsolatedHold();
        return 0;
      case "isolated":
        return holdIsolatedN(question, plan);
      default: {
        const unexpected = plan.kind;
        void unexpected;
        clearIsolatedHold();
        return 0;
      }
    }
  }

  function holdIsolatedN(question, plan) {
    const holdMs = plan && plan.holdMs ? plan.holdMs : engine.isolatedHoldMs(question);
    if (!holdMs) {
      clearIsolatedHold();
      return 0;
    }
    const model = engine.whyModel(question);
    if (!model) {
      clearIsolatedHold();
      return 0;
    }
    els.why.hidden = false;
    els.why.querySelectorAll(".why-n-value").forEach((node) => {
      node.textContent = String(engine.whyLeftover(model));
    });
    els.why.classList.add("is-preview");
    els.why.classList.remove("is-tilt-left", "is-tilt-right");
    els.why.dataset.phase = "reveal";
    setWhyPrompt(question, "reveal");
    setWhyCaption("", "reveal");
    setFeedback("", "");
    screens.practice.dataset.state = "idle";
    screens.practice.classList.add("is-isolated");
    screens.practice.dataset.isolatedHold = "true";
    state.holdingIsolated = true;
    els.keypad.hidden = true;
    els.answer.hidden = true;
    return holdMs;
  }

  function setAnswer(value) {
    state.buffer = value;
    els.answer.textContent = value || " ";
    els.answer.classList.toggle("is-empty", !value);
    if (!state.locked) {
      screens.practice.dataset.state = "idle";
      clearWhyTilt();
    }
    syncWhyPreview(value);
  }

  function setFeedback(message, kind) {
    els.feedback.textContent = message;
    els.feedback.dataset.kind = kind || "";
  }

  function updateHud() {
    const question = state.round ? currentQuestion() : null;
    const hideQuiz = !engine.showsQuizHud(question);
    els.quizHud.hidden = hideQuiz;
    if (hideQuiz) {
      els.progress.textContent = "";
      return;
    }
    const summary = engine.summarize(state.results);
    els.scoreCorrect.textContent = String(summary.correct);
    els.scoreAsked.textContent = String(summary.asked);
    els.streak.textContent = String(state.streak);
    const timed = state.settings.timerSeconds > 0;
    els.timer.hidden = !timed;
    if (timed) {
      els.timer.textContent = engine.formatClock(Math.ceil(state.remainingMs / 1000));
    }
    if (timed) {
      els.progress.textContent = "Until the timer ends";
    } else {
      const current = state.locked ? state.asked : state.asked + 1;
      els.progress.textContent = `${Math.min(current, state.settings.questionCount)} / ${state.settings.questionCount}`;
    }
  }

  const PLACE_LABELS = ["Ones", "Tens", "Hundreds", "Thousands", "10,000s"];

  function digitCells(value, width) {
    return String(value).padStart(width, " ").split("").map((char) => (char === " " ? "" : char));
  }

  function makePlaceInput(label, carry) {
    const box = document.createElement("div");
    box.className = carry ? "place-cell is-carry" : "place-cell";
    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "numeric";
    input.autocomplete = "off";
    input.maxLength = 1;
    input.setAttribute("aria-label", label);
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(-1);
    });
    box.append(input);
    return box;
  }

  function makePlaceLocked(value) {
    const box = document.createElement("div");
    box.className = "place-cell is-locked";
    box.textContent = value;
    return box;
  }

  function makePlaceRow(options) {
    const row = document.createElement("div");
    row.className = "place-row";
    const op = document.createElement("div");
    op.className = "place-op";
    op.textContent = options.op || "";
    row.append(op);
    options.cells.forEach((cell) => row.append(cell));
    return row;
  }

  function renderPlacePad(question) {
    const width = Math.max(
      String(question.left).length,
      String(question.right).length,
      String(question.answer).length,
    );
    const pad = document.createElement("div");
    pad.className = "place-pad";
    pad.style.setProperty("--places", String(width));
    pad.setAttribute("role", "group");
    pad.setAttribute("aria-label", "Line up the numbers");

    const head = document.createElement("div");
    head.className = "place-row";
    const headOp = document.createElement("div");
    headOp.className = "place-op";
    head.append(headOp);
    PLACE_LABELS.slice(0, width).reverse().forEach((name) => {
      const label = document.createElement("div");
      label.className = "place-label";
      label.textContent = name;
      head.append(label);
    });

    const carryCells = PLACE_LABELS.slice(0, width)
      .reverse()
      .map((name) => makePlaceInput(`Carry ${name}`, true));
    const topCells = digitCells(question.left, width).map((digit) => makePlaceLocked(digit));
    const bottomCells = digitCells(question.right, width).map((digit) => makePlaceLocked(digit));
    const workCells = PLACE_LABELS.slice(0, width)
      .reverse()
      .map((name) => makePlaceInput(name, false));

    const ruleRow = document.createElement("div");
    ruleRow.className = "place-row";
    ruleRow.append(document.createElement("div"));
    const rule = document.createElement("div");
    rule.className = "place-rule";
    ruleRow.append(rule);

    pad.append(
      head,
      makePlaceRow({
        op: question.operation === "subtract" ? "Borrow" : "Carry",
        cells: carryCells,
      }),
      makePlaceRow({ cells: topCells }),
      makePlaceRow({ op: question.symbol, cells: bottomCells }),
      ruleRow,
      makePlaceRow({ cells: workCells }),
    );
    els.scratchType.replaceChildren(pad);
  }

  function renderScratchNotes() {
    const area = document.createElement("textarea");
    area.className = "scratch-notes";
    area.rows = 5;
    area.placeholder = "Scratch here";
    area.setAttribute("aria-label", "Scratch paper");
    els.scratchType.replaceChildren(area);
  }

  function sizeScratchCanvas() {
    const canvas = els.scratchDraw;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(rect.width * dpr));
    const height = Math.max(1, Math.floor(rect.height * dpr));
    if (canvas.width === width && canvas.height === height) {
      return;
    }
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#243038";
  }

  function canvasPoint(event) {
    const rect = els.scratchDraw.getBoundingClientRect();
    return {
      x: event.clientX - rect.left,
      y: event.clientY - rect.top,
      width: event.pointerType === "pen" ? Math.max(2, (event.pressure || 0.5) * 6) : 3,
    };
  }

  function drawScratchTo(event) {
    const ctx = els.scratchDraw.getContext("2d");
    const point = canvasPoint(event);
    ctx.lineWidth = point.width;
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(point.x, point.y);
  }

  function updateScratchMode() {
    const draw = selectedScratchMode() === "draw";
    els.scratchType.hidden = draw;
    els.scratchDraw.hidden = !draw;
    if (draw) {
      window.requestAnimationFrame(sizeScratchCanvas);
    }
  }

  function clearVisibleScratch() {
    if (selectedScratchMode() === "draw") {
      const ctx = els.scratchDraw.getContext("2d");
      ctx.clearRect(0, 0, els.scratchDraw.width, els.scratchDraw.height);
      return;
    }
    const question = state.round ? currentQuestion() : null;
    if (
      question
      && !engine.FIND_N_TOPICS.includes(question.topic)
      && (question.operation === "add" || question.operation === "subtract")
    ) {
      renderPlacePad(question);
    } else {
      renderScratchNotes();
    }
  }

  function renderWorkspace(question) {
    const show = engine.usesWorkspace(state.settings);
    els.workspace.hidden = !show;
    if (!show) {
      return;
    }
    if (
      !engine.FIND_N_TOPICS.includes(question.topic)
      && (question.operation === "add" || question.operation === "subtract")
    ) {
      renderPlacePad(question);
    } else {
      renderScratchNotes();
    }
    const ctx = els.scratchDraw.getContext("2d");
    ctx.clearRect(0, 0, els.scratchDraw.width, els.scratchDraw.height);
    updateScratchMode();
  }

  function renderChoices(question) {
    els.choices.replaceChildren();
    (question.choices || []).forEach((choice) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice-answer";
      button.textContent = choice.label;
      button.addEventListener("click", () => {
        if (state.locked) {
          return;
        }
        setAnswer(choice.value);
        Array.from(els.choices.children).forEach((node) => {
          node.classList.toggle("is-picked", node === button);
          node.disabled = true;
        });
        submitAnswer();
      });
      els.choices.append(button);
    });
  }

  function renderFigure(question) {
    if (question.figureSvg) {
      els.figure.hidden = false;
      els.figure.innerHTML = question.figureSvg;
      return;
    }
    els.figure.hidden = true;
    els.figure.replaceChildren();
  }

  function showQuestion() {
    if (state.holdingIsolated) {
      return;
    }
    const question = currentQuestion();
    const isWords = question.topic === "shapes";
    const isChoice = question.answerKind === "choice";
    const isBoard = engine.usesWhyModel(question);
    state.locked = false;
    clearIsolatedHold();
    screens.practice.classList.toggle("is-board", isBoard);
    screens.practice.classList.toggle("is-lifted", false);
    setAnswer("");
    setFeedback(question.hint || "Type the answer", "");
    els.prompt.classList.toggle("is-words", isWords);
    if (question.promptHtml) {
      els.prompt.innerHTML = question.promptHtml;
    } else {
      els.prompt.textContent = isWords ? question.prompt : `${question.prompt} =`;
    }
    els.prompt.dataset.operation = question.operation;
    screens.practice.dataset.state = "idle";
    renderFigure(question);
    renderWhyModel(question);
    els.answer.hidden = isChoice || isBoard;
    els.keypad.hidden = isChoice || !engine.leftoverTypingAllowed(question, whyMoveDone());
    els.choices.hidden = !isChoice;
    if (isChoice) {
      renderChoices(question);
    } else {
      els.choices.replaceChildren();
    }
    renderWorkspace(question);
    updateHud();
  }

  function clearTimers() {
    window.clearInterval(state.timerId);
    window.clearTimeout(state.advanceId);
    window.clearTimeout(state.whyId);
    state.timerId = null;
    state.advanceId = null;
    state.whyId = null;
    clearIsolatedHold();
  }

  function finishRound() {
    clearTimers();
    const summary = engine.summarize(state.results);
    state.progress = engine.applyRoundProgress(
      state.progress,
      state.settings.topic,
      summary,
      state.streakPeak,
    );
    saveProgress(state.progress);
    if (engine.returnsToPath(state.settings.topic)) {
      showTrail("grade", engine.START_CHAPTER_ID);
      return;
    }
    const elapsedSeconds = Math.max(1, Math.round((Date.now() - state.startedAt) / 1000));
    els.resultsHeadline.textContent = engine.headlineFor(summary);
    els.resultsScore.textContent = `${summary.correct} / ${summary.asked}`;
    els.resultsAccuracy.textContent = summary.asked ? `${summary.accuracy}% correct` : "No answers";
    els.resultsTime.textContent = `Time ${engine.formatClock(elapsedSeconds)}`;
    if (state.settings.topic === "shapes" || engine.FIND_N_TOPICS.includes(state.settings.topic)) {
      els.missedHeading.textContent = "Missed";
    } else if (state.settings.topic === "times") {
      els.missedHeading.textContent = "Missed facts";
    } else {
      els.missedHeading.textContent = "Missed problems";
    }
    els.missedList.replaceChildren();
    if (!summary.missed.length) {
      const empty = document.createElement("li");
      empty.className = "missed-empty";
      empty.textContent = "No missed facts.";
      els.missedList.append(empty);
    } else {
      summary.missed.forEach((item) => {
        const row = document.createElement("li");
        row.textContent = item.review || `${item.prompt} = ${item.answer}`;
        els.missedList.append(row);
      });
    }
    els.practiceMissed.hidden = summary.missed.length === 0;
    showScreen("results");
  }

  function startTimer() {
    state.remainingMs = state.settings.timerSeconds * 1000;
    updateHud();
    const started = Date.now();
    state.timerId = window.setInterval(() => {
      state.remainingMs = Math.max(0, state.settings.timerSeconds * 1000 - (Date.now() - started));
      updateHud();
      if (state.remainingMs <= 0) {
        finishRound();
      }
    }, 200);
  }

  function beginRound(settings, replayQuestions) {
    clearTimers();
    const topic = engine.playableTopic(settings && settings.topic);
    state.settings = engine.returnsToPath(topic)
      ? engine.whyRunSettings(topic)
      : engine.normalizeSettings({
        ...settings,
        topic,
      });
    saveSettings(state.settings);
    state.earnedThisRound = 0;
    updateChrome();
    state.round = replayQuestions && replayQuestions.length
      ? engine.buildReplayRound(replayQuestions, state.settings)
      : engine.buildRound(state.settings);
    state.asked = 0;
    state.results = [];
    state.streak = 0;
    state.streakPeak = 0;
    state.startedAt = Date.now();
    screens.practice.classList.toggle(
      "is-board",
      engine.PLAYABLE_TRAIL_TOPICS.includes(state.settings.topic),
    );
    showScreen("practice");
    showQuestion();
    if (state.settings.timerSeconds > 0) {
      startTimer();
    }
  }

  function shouldEndAfterAnswer() {
    if (state.settings.timerSeconds > 0) {
      return state.remainingMs <= 0;
    }
    return state.results.length >= state.settings.questionCount;
  }

  function submitAnswer() {
    if (state.locked) {
      return;
    }
    const question = currentQuestion();
    if (engine.usesWhyModel(question) && !whyMoveDone()) {
      nudgeWhyMove(question);
      return;
    }
    const grade = engine.gradeAnswer(question, state.buffer);
    if (grade.empty) {
      setFeedback(question.answerKind === "choice" ? "Tap a name" : "Enter a number", "hint");
      return;
    }

    const plan = engine.leftoverHoldPlan(question, grade);
    if (plan.kind === "stay") {
      tiltWhyScale(question, grade.given);
      setFeedback("", "bad");
      screens.practice.dataset.state = "bad";
      return;
    }

    state.locked = true;
    state.results.push({ question, ok: grade.ok, given: grade.given });
    state.asked += 1;
    if (grade.ok) {
      state.streak += 1;
      state.streakPeak = Math.max(state.streakPeak, state.streak);
      const payout = engine.payoutCoins({
        ok: true,
        usesWhy: engine.usesWhyModel(question),
        whyDone: whyMoveDone(),
        streak: state.streak,
        earnedThisRound: state.earnedThisRound,
      });
      if (payout > 0) {
        state.progress = engine.applyCoinPayout(state.progress, payout);
        state.earnedThisRound += payout;
        saveProgress(state.progress);
        renderCoinHud();
      }
      setFeedback(engine.usesWhyModel(question) ? "" : "Correct", "ok");
      screens.practice.dataset.state = "ok";
    } else {
      state.streak = 0;
      const explain = question.review || `${question.prompt} = ${question.answer}`;
      setFeedback(engine.usesWhyModel(question) ? "" : `Not quite — ${explain}`, "bad");
      screens.practice.dataset.state = "bad";
    }
    const holdMs = applyHoldPlan(question, plan);
    if (!holdMs) {
      updateHud();
    }

    const delay = holdMs
      ? holdMs
      : grade.ok
        ? 700
        : question.review
          ? 1600
          : 1300;
    state.advanceId = window.setTimeout(() => {
      state.holdingIsolated = false;
      if (shouldEndAfterAnswer()) {
        finishRound();
        return;
      }
      showQuestion();
    }, delay);
  }

  function pressKey(key) {
    if (state.locked) {
      return;
    }
    const question = state.round ? currentQuestion() : null;
    if (question && question.answerKind === "choice") {
      return;
    }
    if (key === "Enter") {
      submitAnswer();
      return;
    }
    if (key === "Backspace") {
      setAnswer(state.buffer.slice(0, -1));
      return;
    }
    if (/^\d$/.test(key)) {
      const whyDone = whyMoveDone();
      if (question && !engine.leftoverTypingAllowed(question, whyDone)) {
        nudgeWhyMove(question);
        return;
      }
      setAnswer(engine.appendAnswerDigit(state.buffer, key, question, whyDone));
    }
  }

  function renderKeypad() {
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "Backspace", "0", "Enter"];
    els.keypad.replaceChildren();
    keys.forEach((key) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "key";
      button.dataset.key = key;
      if (key === "Backspace") {
        button.textContent = "⌫";
        button.setAttribute("aria-label", "Delete");
      } else if (key === "Enter") {
        button.textContent = "OK";
        button.classList.add("is-enter");
      } else {
        button.textContent = key;
      }
      button.addEventListener("click", () => pressKey(key));
      els.keypad.append(button);
    });
  }

  els.backChapters.addEventListener("click", () => {
    showTrail("chapters");
  });

  document.querySelectorAll('input[name="scratch-mode"]').forEach((input) => {
    input.addEventListener("change", updateScratchMode);
  });

  els.clearScratch.addEventListener("click", clearVisibleScratch);

  els.scratchDraw.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    els.scratchDraw.setPointerCapture(event.pointerId);
    sizeScratchCanvas();
    const ctx = els.scratchDraw.getContext("2d");
    const point = canvasPoint(event);
    ctx.beginPath();
    ctx.moveTo(point.x, point.y);
    drawScratchTo(event);
  });

  els.scratchDraw.addEventListener("pointermove", (event) => {
    if (!els.scratchDraw.hasPointerCapture(event.pointerId)) {
      return;
    }
    event.preventDefault();
    drawScratchTo(event);
  });

  els.scratchDraw.addEventListener("pointerup", (event) => {
    if (els.scratchDraw.hasPointerCapture(event.pointerId)) {
      els.scratchDraw.releasePointerCapture(event.pointerId);
    }
    els.scratchDraw.getContext("2d").beginPath();
  });

  window.addEventListener("resize", () => {
    if (!els.scratchDraw.hidden) {
      sizeScratchCanvas();
    }
  });

  els.restart.addEventListener("click", () => beginRound(state.settings));
  els.changeTables.addEventListener("click", () => {
    clearTimers();
    hydrateTrail();
    showTrail("grade", engine.START_CHAPTER_ID);
  });
  els.playAgain.addEventListener("click", () => beginRound(state.settings));
  els.resultsChange.addEventListener("click", () => {
    hydrateTrail();
    showTrail("grade", engine.START_CHAPTER_ID);
  });
  els.practiceMissed.addEventListener("click", () => {
    const missed = state.results.filter((result) => !result.ok);
    const nextSettings = {
      ...state.settings,
      topic: engine.playableTopic(state.settings.topic),
      timerSeconds: 0,
      questionCount: Math.max(10, missed.length),
    };
    beginRound(nextSettings, missed.map((result) => result.question));
  });

  document.addEventListener("keydown", (event) => {
    if (event.target.closest && event.target.closest("#workspace")) {
      return;
    }
    if (screens.practice.hidden) {
      if (event.key === "Enter" && !screens.trail.hidden && state.trailView === "chapters") {
        showTrail("grade", engine.START_CHAPTER_ID);
      } else if (event.key === "Enter" && !screens.trail.hidden && state.trailView === "grade") {
        startPlayableNode(engine.startNode());
      }
      return;
    }
    if (event.key === "Enter" || event.key === "Backspace" || /^\d$/.test(event.key)) {
      event.preventDefault();
      pressKey(event.key);
    }
  });

  renderKeypad();
  hydrateTrail();
  showTrail("grade", engine.START_CHAPTER_ID);

})();

    </script>
  </body>
</html>
