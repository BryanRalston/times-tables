name: Deploy GitHub Pages

# Pages source must be "GitHub Actions". "Deploy from a branch" publishes the
# Vite template at repo root (/src/main.tsx) and React never mounts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Guard built index for Pages
        run: |
          touch dist/.nojekyll
          grep -E 'assets/[^"]+\.js' dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "dist/index.html still points at /src/main.tsx" >&2
            exit 1
          fi
          if grep -q '%BASE_URL%' dist/index.html; then
            echo "dist/index.html still has unsubstituted %BASE_URL%" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
